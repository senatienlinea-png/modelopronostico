name: actualizacion-diaria
on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 06:00 hora de Lima
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python scripts/modelo.py
      - name: Guardar cambios
        run: |
          git config user.name "bot-modelo-elnino"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Actualización diaria $(date -u +%F)"
          git push
